<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cosmic Conquest — A Voyage Through the Future That Never Came</title>
    <meta name="description" content="Cosmic Conquest: explore a 1950s space-age future that never came. Hunt bounties, solve cases, send postcards and seal predictions in the Time Capsule." />
    <meta name="theme-color" content="#1c120a" />
    <!-- Added to the Home Screen, it opens full screen with no browser bars -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cosmic Conquest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="preload" href="/fonts/bangers.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Loading splash: shown until the game and its fonts are ready, then it
         fades away (client/src/main.tsx). Plain CSS so it paints instantly. */
      html, body { margin: 0; background: #1c120a; }
      #boot {
        position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 42%, #4a2a14 0%, #1c120a 62%);
        color: #f0c040; font-family: system-ui, -apple-system, sans-serif; text-align: center;
        transition: opacity .45s ease, visibility .45s;
      }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot .burst {
        width: 74px; height: 74px; margin: 0 auto 14px; background: #e8b830; color: #2a1a0a;
        display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900;
        clip-path: polygon(50% 0%, 61% 15%, 78% 5%, 75% 24%, 95% 25%, 83% 40%, 100% 50%, 83% 60%, 95% 75%, 75% 76%, 78% 95%, 61% 85%, 50% 100%, 39% 85%, 22% 95%, 25% 76%, 5% 75%, 17% 60%, 0% 50%, 17% 40%, 5% 25%, 25% 24%, 22% 5%, 39% 15%);
        animation: boot-spin 6s linear infinite;
      }
      #boot .title { font-size: 26px; font-weight: 900; font-style: italic; letter-spacing: .08em; text-shadow: 0 3px 0 #7a2a10; }
      #boot .sub { margin-top: 10px; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: #d9c7a0; }
      #boot .bars { display: flex; gap: 4px; justify-content: center; align-items: flex-end; height: 18px; margin-top: 12px; }
      #boot .bars i { width: 5px; background: #f0c040; border-radius: 1px; animation: boot-bar 1s ease-in-out infinite; }
      #boot .bars i:nth-child(1) { height: 25%; } #boot .bars i:nth-child(2) { height: 45%; animation-delay: .12s; }
      #boot .bars i:nth-child(3) { height: 65%; animation-delay: .24s; } #boot .bars i:nth-child(4) { height: 85%; animation-delay: .36s; }
      #boot .bars i:nth-child(5) { height: 100%; animation-delay: .48s; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-bar { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot .burst, #boot .bars i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div>
        <div class="burst">★</div>
        <div class="title">COSMIC CONQUEST</div>
        <div class="sub">Tuning in</div>
        <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
