name: Add Bounty Office No Hero asset

on:
  push:
    branches:
      - "claude/nice-franklin-7moqso"
    paths:
      - ".github/workflows/add-bounty-office-no-hero.yml"
      - ".bounty_upload/READY"

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nice-franklin-7moqso
      - name: Assemble image
        shell: bash
        run: |
          if [ ! -f .bounty_upload/READY ]; then
            echo "Upload not ready yet."
            exit 0
          fi
          cat .bounty_upload/chunk-* | tr -d '\n' | base64 -d > "client/public/scenes/Bounty Office No Hero.jpg"
          rm -rf .bounty_upload
          rm -f .github/workflows/add-bounty-office-no-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Bounty Office No Hero image"
          git push
